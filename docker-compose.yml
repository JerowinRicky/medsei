version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: medsei-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: medsei_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: medsei-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medsei-backend
    restart: always
    depends_on:
      - postgres
      - ai-service
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/medsei_db?schema=public
      - JWT_SECRET=medsei_super_secure_jwt_secret_token_2026_enterprise_hospital_key
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medsei-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:

